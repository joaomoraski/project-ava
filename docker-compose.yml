services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ava
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ava_dev_password}
      POSTGRES_DB: ava
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ava"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
